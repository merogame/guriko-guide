<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101113">
<title>グリコガイド</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#101113;color:#f5f5f5;touch-action:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
main{position:relative;width:min(100%,28rem);height:100%;height:100dvh;margin:auto}
#setup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(18rem,calc(100% - 2rem));display:grid;gap:1rem;text-align:center}
input{width:100%;height:3.5rem;padding:.5rem;border:1px solid #3c3e43;border-radius:.6rem;background:#222429;color:inherit;font:600 2rem/1 system-ui;text-align:center;appearance:textfield;user-select:text;-webkit-user-select:text}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.remaining{position:absolute;left:1rem;right:1rem;top:max(1rem,env(safe-area-inset-top));display:grid;grid-template-columns:1fr 1fr;text-align:center;gap:1rem}
.remaining span{display:block;color:#a6a8ad;font-size:1rem}
.remaining output{display:block;margin-top:.25rem;font-size:clamp(2rem,7vh,3rem);font-weight:600;line-height:1.2}
#move{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f8e24b;font-size:clamp(2rem,16vmin,5rem);font-weight:700;line-height:1.3;white-space:nowrap}
#move[role=button]{cursor:pointer}
.hands{position:absolute;left:max(1rem,env(safe-area-inset-left));right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
button{height:clamp(3.25rem,14dvh,5.5rem);padding:0;border:1px solid #3c3e43;border-radius:.6rem;background:#222429;color:inherit;font:600 clamp(1rem,4vw,1.25rem)/1 system-ui,-apple-system,"Yu Gothic",sans-serif;touch-action:none;cursor:pointer}
button:active:not(:disabled){background:#3c3e43}
button:disabled{color:#62656b;background:#191a1d;border-color:#25272b;cursor:default}
button:focus-visible,input:focus-visible,#move:focus-visible{outline:2px solid #f8e24b;outline-offset:2px}
@media(max-height:350px){#setup{gap:.5rem}input{height:3rem}.remaining{top:max(.5rem,env(safe-area-inset-top))}.remaining span{font-size:.875rem}.remaining output{font-size:2rem}}
</style>
<main>
<form id="setup">
<label for="goal">ゴールまでの歩数</label>
<input id="goal" type="number" inputmode="numeric" min="1" max="999" step="1" value="30" required>
<button id="start" type="submit">開始</button>
</form>
<section id="game" hidden>
<div class="remaining"><div><span>相手</span><output id="opponent" aria-label="相手の残り歩数"></output></div><div><span>自分</span><output id="own" aria-label="自分の残り歩数"></output></div></div>
<output id="move" aria-label="推奨手" aria-live="polite"></output>
<div class="hands" role="group" aria-label="相手の手"><button type="button">グー</button><button type="button">チョキ</button><button type="button">パー</button></div>
</section>
</main>
<script>
async function equilibrium(n){
  const size=n+1,values=new Float64Array(size*size),policy=new Float64Array(size*size*2);
  for(let b=0;b<size;b++)values[b]=1;
  let last=performance.now();
  for(let a=1;a<=n;a++){
    for(let b=1;b<=a;b++){
      const r=values[Math.max(0,a-1)*size+b],s=values[Math.max(0,a-2)*size+b],u=values[a*size+b-1],t=values[a*size+Math.max(0,b-2)];
      let v=.5;
      if(a!==b){let lo=u,hi=Math.min(.5,r);for(let k=0;k<48;k++){const m=(lo+hi)/2;if((r-m)*(s-m)*(s-m)>(m-u)*(m-t)*(m-t))lo=m;else hi=m}v=(lo+hi)/2}
      let x=(v-u)*(v-t),y=(s-v)*(r-v);
      const z=(v-u)*(r-v);
      if(a===b)x=y=(x+y)/2;
      const sum=x+y+z;
      if(!(sum>0)||x<0||y<0||z<0)throw Error('Equilibrium failed');
      const i=a*size+b,j=b*size+a;
      values[i]=v;values[j]=a===b?.5:1-v;
      policy[i*2]=x/sum;policy[i*2+1]=y/sum;policy[j*2]=y/sum;policy[j*2+1]=x/sum;
    }
    if(performance.now()-last>8){await new Promise(resolve=>setTimeout(resolve,0));last=performance.now()}
  }
  return{size,values,policy};
}
const setup=document.getElementById('setup'),goal=document.getElementById('goal'),start=document.getElementById('start'),game=document.getElementById('game'),move=document.getElementById('move'),own=document.getElementById('own'),opponent=document.getElementById('opponent'),buttons=[...document.querySelectorAll('.hands button')],names=['グー','チョキ','パー'],steps=[3,6,6],random=new Uint32Array(1);
let table,units=0,a=0,b=0,chosen=0,phase='setup';
function draw(){
  const i=(Math.ceil(a/3)*table.size+Math.ceil(b/3))*2,p=table.policy;
  crypto.getRandomValues(random);const r=(random[0]+.5)/4294967296;
  chosen=r<p[i]?0:r<p[i]+p[i+1]?1:2;phase='ready';
  move.textContent=names[chosen];move.setAttribute('aria-label','推奨手：'+names[chosen]);move.removeAttribute('role');move.removeAttribute('tabindex');
  for(const button of buttons)button.disabled=false;
}
function counts(){own.textContent=a;opponent.textContent=b}
function play(other){
  if(phase!=='ready')return;
  const result=(chosen-other+3)%3;
  if(result===2)a=Math.max(0,a-steps[chosen]);else if(result===1)b=Math.max(0,b-steps[other]);
  counts();phase=a===0||b===0?'end':'result';
  move.textContent=a===0?'勝ち':b===0?'負け':result===2?'自分＋'+steps[chosen]:result===1?'相手＋'+steps[other]:'あいこ';
  move.setAttribute('role','button');move.setAttribute('tabindex','0');move.setAttribute('aria-label',move.textContent+(phase==='end'?'。歩数の設定へ':'。次の手'));
  for(const button of buttons)button.disabled=true;
}
function next(){if(phase==='result')draw();else if(phase==='end'){phase='setup';game.hidden=true;setup.hidden=false}}
setup.addEventListener('submit',async e=>{
  e.preventDefault();if(phase!=='setup'||!goal.checkValidity())return;
  const distance=goal.valueAsNumber,n=Math.ceil(distance/3);if(!Number.isInteger(distance)||distance<1||distance>999)return;
  phase='busy';start.disabled=goal.disabled=true;start.textContent='…';
  try{if(!table||units!==n){await new Promise(resolve=>setTimeout(resolve,0));table=await equilibrium(n);units=n}a=b=distance;counts();draw();setup.hidden=true;game.hidden=false}
  catch(error){phase='setup';goal.setCustomValidity('計算できませんでした。');goal.reportValidity();console.error(error)}
  finally{start.disabled=goal.disabled=false;start.textContent='開始'}
});
goal.addEventListener('input',()=>goal.setCustomValidity(''));
buttons.forEach((button,i)=>button.addEventListener('click',()=>play(i)));
move.addEventListener('click',next);
move.addEventListener('keydown',e=>{if((phase==='result'||phase==='end')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}});
for(const name of ['touchmove','wheel','gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(name,e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','_','0','Add','Subtract'].includes(e.key))e.preventDefault()});
</script>
</html>
